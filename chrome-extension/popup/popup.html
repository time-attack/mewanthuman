<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: 22px;
      color: #e44d26;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 20px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .status-bar.ok {
      background: rgba(46, 160, 67, 0.15);
      color: #2ea043;
      border: 1px solid rgba(46, 160, 67, 0.3);
    }
    .status-bar.err {
      background: rgba(228, 77, 38, 0.15);
      color: #e44d26;
      border: 1px solid rgba(228, 77, 38, 0.3);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ok .dot { background: #2ea043; }
    .err .dot { background: #e44d26; }
    .info {
      font-size: 12px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>MeWantHuman</h1>
  <p class="subtitle">Skip the phone tree. Get a human.</p>

  <div id="status" class="status-bar ok">
    <span class="dot"></span>
    <span id="statusText">Checking...</span>
  </div>

  <p class="info">
    Phone numbers on any page get a "Human" button.<br>
    Click it and the AI navigates the phone tree for you.
  </p>

  <script src="popup.js"></script>
</body>
</html>
