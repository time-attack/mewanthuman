<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mewanthuman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #F1ECE0;
      --paper:    #FAF6EC;
      --paper-2:  #F5EFE0;
      --stone:    #E7DFCD;
      --rule:     #D8CEB6;
      --ink:      #1F1A14;
      --ink-2:    #3D352A;
      --ink-mid:  #7A6E5B;
      --ink-low:  #ADA28C;
      --accent:   #BE5A3F;
      --accent-2: #E2C28A;
      --moss:     #5B7048;
      --rose:     #C8967D;
      --success:  #5B7048;
      --warn:     #C58B2B;

      --sans:  "Geist", ui-sans-serif, system-ui, sans-serif;
      --mono:  "Geist Mono", ui-monospace, "SF Mono", monospace;
      --serif: "Instrument Serif", Georgia, serif;

      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 16px;
      --r-xl: 22px;

      --shadow-card: 0 1px 0 rgba(255,255,255,.6) inset, 0 1px 2px rgba(40,30,15,.04), 0 8px 28px -12px rgba(50,35,15,.18);
      --shadow-soft: 0 1px 2px rgba(40,30,15,.04), 0 14px 40px -18px rgba(50,35,15,.18);
    }

    html, body { margin: 0; padding: 0; background: var(--bg); height: 100%; overflow: hidden; }
    #root { height: 100vh; display: flex; flex-direction: column; }

    /* ── Shared atoms ── */
    .kicker {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ink-mid); white-space: nowrap;
    }
    .mono { font-family: var(--mono); }
    .serif-em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent); }
    .tnum { font-variant-numeric: tabular-nums; }
    .s { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 16px; border-radius: 999px;
      font-family: var(--sans); font-size: 13px; font-weight: 500;
      background: var(--ink); color: var(--paper);
      border: .5px solid var(--ink); cursor: pointer; white-space: nowrap;
    }
    .btn:hover { opacity: .9; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
    .btn.ghost:hover { border-color: var(--ink-mid); }
    .btn.accent { background: var(--accent); border-color: var(--accent); color: #FFF8EF; }
    .btn.accent:hover { filter: brightness(1.05); }
    .btn.sm { height: 28px; padding: 0 12px; font-size: 12px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 22px; padding: 0 9px; border-radius: 999px;
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em;
      background: var(--paper); color: var(--ink-2);
      border: .5px solid var(--rule); white-space: nowrap;
    }
    .chip.live { background: color-mix(in oklab, var(--accent) 14%, var(--paper)); color: var(--accent); border-color: color-mix(in oklab, var(--accent) 30%, var(--rule)); }
    .chip.ok { background: color-mix(in oklab, var(--success) 14%, var(--paper)); color: var(--success); border-color: color-mix(in oklab, var(--success) 30%, var(--rule)); }
    .chip.muted { color: var(--ink-mid); }

    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      animation: pulse 1.6s ease-out infinite; display: inline-block;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 50%, transparent); }
      100% { box-shadow: 0 0 0 8px color-mix(in oklab, var(--accent) 0%, transparent); }
    }

    .card {
      background: var(--paper); border: .5px solid var(--rule);
      border-radius: var(--r-lg); box-shadow: var(--shadow-card);
    }

    .rule { height: 1px; background: var(--rule); border: 0; margin: 0; }

    .logo {
      font-family: var(--sans); font-weight: 500; letter-spacing: -.01em;
      font-size: 15px; color: var(--ink); display: inline-flex; align-items: center; gap: 8px;
    }
    .logo .em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent); }
    .logo .mark {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--ink); position: relative; overflow: hidden;
    }
    .logo .mark::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 30% 30%, var(--accent) 0 32%, transparent 33%);
    }

    /* Text input */
    .text-input {
      width: 100%; background: var(--paper); border: .5px solid var(--rule);
      border-radius: var(--r-md); color: var(--ink); outline: none;
      font-family: var(--sans); font-size: 14px; padding: 12px 16px;
      transition: border-color .15s, box-shadow .15s;
    }
    .text-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 12%, transparent); }
    .text-input::placeholder { color: var(--ink-low); }
    textarea.text-input { resize: none; min-height: 92px; line-height: 1.55; }
    .text-input.mono-input { font-family: var(--mono); font-size: 18px; letter-spacing: .04em; }

    .spinner {
      width: 13px; height: 13px; border: 2px solid currentColor;
      border-top-color: transparent; border-radius: 50%;
      animation: spin .7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes dot-bounce { 0%,80%,100% { transform: translateY(0); opacity:.4; } 40% { transform: translateY(-3px); opacity:1; } }
    @keyframes wave { from { transform: scaleY(.6); } to { transform: scaleY(1.4); } }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

    /* App-level layout handled in React inline styles */
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
// ═══════════════════════════════════════════════════════════════════════
// Utility
// ═══════════════════════════════════════════════════════════════════════

function toE164(raw) {
  const s = raw.replace(/[\s\(\)\-\.]/g, '');
  if (/^\+\d{11,}$/.test(s)) return s;
  const d = s.replace(/\D/g, '');
  if (d.length === 10) return '+1' + d;
  if (d.length === 11 && d[0] === '1') return '+' + d;
  return null;
}

function formatElapsed(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// ═══════════════════════════════════════════════════════════════════════
// Icons
// ═══════════════════════════════════════════════════════════════════════

function Glyph({ k, size = 14 }) {
  const c = "s";
  switch (k) {
    case "plus":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M12 5v14M5 12h14"/></svg>;
    case "phone":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M5 4h4l2 5-2 1a11 11 0 0 0 5 5l1-2 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>;
    case "check":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="m5 12 5 5 9-11"/></svg>;
    case "wave":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M3 12h2l2-6 3 12 3-9 3 6 2-3h3"/></svg>;
    case "clock":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>;
    case "chev":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="m9 6 6 6-6 6"/></svg>;
    case "down":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="m6 9 6 6 6-6"/></svg>;
    case "search":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg>;
    case "settings":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><circle cx="12" cy="12" r="3"/><path d="M19 12c0 .7-.1 1.3-.2 2l2 1.5-2 3.4-2.4-1c-1 .8-2.1 1.4-3.4 1.6L13 22h-4l-.4-2.5c-1.3-.2-2.4-.8-3.4-1.6l-2.4 1-2-3.4 2-1.5C2.6 13.3 2.5 12.7 2.5 12s.1-1.3.2-2l-2-1.5 2-3.4 2.4 1c1-.8 2.1-1.4 3.4-1.6L9 2h4l.4 2.5c1.3.2 2.4.8 3.4 1.6l2.4-1 2 3.4-2 1.5c.1.7.2 1.3.2 2Z"/></svg>;
    case "bell":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 7H4c0-1 2-2 2-7ZM10 20a2 2 0 0 0 4 0"/></svg>;
    default: return null;
  }
}

function SideIcon({ k }) {
  const c = "s";
  switch (k) {
    case 'home':
      return <svg width="14" height="14" viewBox="0 0 24 24" className={c}><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-7h-6v7H5a1 1 0 0 1-1-1v-9Z" /></svg>;
    case 'phone':
      return <svg width="14" height="14" viewBox="0 0 24 24" className={c}><path d="M5 4h4l2 5-2 1a11 11 0 0 0 5 5l1-2 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z" /></svg>;
    case 'history':
      return <svg width="14" height="14" viewBox="0 0 24 24" className={c}><circle cx="12" cy="12" r="8" /><path d="M12 7v5l3 2M5 4 3 6M19 4l2 2" /></svg>;
    case 'building':
      return <svg width="14" height="14" viewBox="0 0 24 24" className={c}><rect x="4" y="3" width="16" height="18" rx="1.5" /><path d="M9 21V14h6v7M9 7h.01M12 7h.01M15 7h.01M9 11h.01M12 11h.01M15 11h.01" /></svg>;
    case 'settings':
      return <svg width="14" height="14" viewBox="0 0 24 24" className={c}><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.5 5.5l2 2M16.5 16.5l2 2M5.5 18.5l2-2M16.5 7.5l2-2"/></svg>;
    default: return null;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// Shared Components
// ═══════════════════════════════════════════════════════════════════════

function Logo({ size = 15 }) {
  return (
    <span className="logo" style={{ fontSize: size }}>
      <span className="mark" style={{ width: size + 3, height: size + 3 }} />
      <span>me<span className="em">want</span>human</span>
    </span>
  );
}

function CompanyAvatar({ name = "Delta", color = "#BE5A3F", subtitle, big = false }) {
  const initial = (name || "?").trim()[0]?.toUpperCase() ?? "?";
  const sz = big ? 44 : 32;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
      <div style={{
        width: sz, height: sz, borderRadius: 10,
        background: color, color: '#FFF8EF',
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'var(--serif)', fontStyle: 'italic',
        fontSize: big ? 22 : 16,
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,.2)'
      }}>{initial}</div>
      <div>
        <div style={{ fontSize: big ? 16 : 13.5, fontWeight: 500, color: 'var(--ink)' }}>{name}</div>
        {subtitle && <div style={{ fontSize: 11.5, color: 'var(--ink-mid)', fontFamily: 'var(--mono)' }}>{subtitle}</div>}
      </div>
    </div>
  );
}

function Tabs({ tabs, active, onChange }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 0,
      padding: '0 28px', borderBottom: '.5px solid var(--rule)',
      background: 'var(--paper-2)', flex: '0 0 auto',
    }}>
      {tabs.map(t => {
        const isActive = t.id === active;
        return (
          <button key={t.id} onClick={() => onChange(t.id)} style={{
            padding: '12px 14px', border: 0, background: 'transparent',
            cursor: 'pointer',
            borderBottom: '2px solid ' + (isActive ? 'var(--ink)' : 'transparent'),
            marginBottom: -1,
            color: isActive ? 'var(--ink)' : 'var(--ink-mid)',
            fontFamily: 'var(--sans)', fontSize: 12.5,
            fontWeight: isActive ? 500 : 400,
            display: 'inline-flex', alignItems: 'center', gap: 8,
            whiteSpace: 'nowrap',
          }}>
            <span>{t.label}</span>
            {t.badge && <span style={{
              fontFamily: 'var(--mono)', fontSize: 10,
              padding: '1px 7px', borderRadius: 999,
              background: t.live ? 'color-mix(in oklab, var(--accent) 14%, var(--paper))' : 'var(--stone)',
              color: t.live ? 'var(--accent)' : 'var(--ink-mid)',
              border: '.5px solid ' + (t.live ? 'color-mix(in oklab, var(--accent) 30%, var(--rule))' : 'transparent'),
            }}>{t.badge}</span>}
          </button>
        );
      })}
    </div>
  );
}

function FormBlock({ label, hint, children }) {
  return (
    <div style={{ marginTop: 24 }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 8 }}>
        <span style={{ fontSize: 12, color: 'var(--ink)', fontWeight: 500 }}>{label}</span>
        {hint && <span style={{ fontSize: 11.5, color: 'var(--ink-mid)' }}>{hint}</span>}
      </div>
      {children}
    </div>
  );
}

function Legend({ dot, label }) {
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
    <span style={{ width: 6, height: 6, borderRadius: '50%', background: dot }} /> {label}
  </span>;
}

// ═══════════════════════════════════════════════════════════════════════
// App Shell
// ═══════════════════════════════════════════════════════════════════════

function AppShell({ route, setRoute, hasActiveCall, callInfo, children }) {
  return (
    <div style={{ flex: 1, display: 'flex', minHeight: 0, fontFamily: 'var(--sans)', color: 'var(--ink)' }}>
      <Sidebar route={route} setRoute={setRoute} hasActiveCall={hasActiveCall} callInfo={callInfo} />
      <main style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: 'var(--bg)', overflow: 'hidden' }}>
        {children}
      </main>
    </div>
  );
}

function Sidebar({ route, setRoute, hasActiveCall, callInfo }) {
  const items = [
    { id: 'home',      label: 'Home',        icon: 'home' },
    { id: 'call',      label: 'Active call',  icon: 'phone', badge: hasActiveCall ? '1' : null, accent: hasActiveCall },
    { id: 'history',   label: 'History',      icon: 'history' },
    { id: 'companies', label: 'Companies',    icon: 'building' },
    { id: 'settings',  label: 'Settings',     icon: 'settings' },
  ];

  return (
    <aside style={{
      width: 232, flex: '0 0 232px',
      background: 'var(--paper-2)', borderRight: '.5px solid var(--rule)',
      display: 'flex', flexDirection: 'column', padding: '22px 16px 18px',
    }}>
      <div style={{ padding: '0 8px 16px' }}><Logo size={15} /></div>

      <button onClick={() => setRoute('new')} className="btn accent"
        style={{ width: '100%', justifyContent: 'flex-start', marginBottom: 22, height: 38, padding: '0 12px', fontSize: 13 }}>
        <Glyph k="plus" size={14} />
        <span>New call</span>
      </button>

      <nav style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
        {items.map(it => {
          const active = route === it.id || (it.id === 'call' && route === 'new');
          return (
            <button key={it.id} onClick={() => setRoute(it.id)} style={{
              display: 'flex', alignItems: 'center', gap: 10,
              padding: '8px 10px', borderRadius: 'var(--r-sm)',
              background: active ? 'var(--bg)' : 'transparent',
              border: '.5px solid ' + (active ? 'var(--rule)' : 'transparent'),
              color: active ? 'var(--ink)' : 'var(--ink-mid)',
              fontFamily: 'var(--sans)', fontSize: 13,
              fontWeight: active ? 500 : 400, cursor: 'pointer', textAlign: 'left',
              whiteSpace: 'nowrap',
            }}>
              <SideIcon k={it.icon} />
              <span>{it.label}</span>
              <span style={{ flex: 1 }} />
              {it.badge && (
                <span style={{
                  fontFamily: 'var(--mono)', fontSize: 10.5,
                  padding: '2px 7px', borderRadius: 999,
                  background: it.accent ? 'var(--accent)' : 'var(--stone)',
                  color: it.accent ? '#FFF8EF' : 'var(--ink-2)',
                  display: 'inline-flex', alignItems: 'center', gap: 5,
                }}>
                  {it.accent && <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#FFF8EF', display: 'inline-block' }} />}
                  {it.badge}
                </span>
              )}
            </button>
          );
        })}
      </nav>

      {hasActiveCall && (
        <div onClick={() => setRoute('call')} style={{
          marginTop: 22, padding: 12,
          background: 'var(--paper)',
          border: '.5px solid color-mix(in oklab, var(--accent) 30%, var(--rule))',
          borderRadius: 'var(--r-md)', cursor: 'pointer',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
            <span className="dot" />
            <span className="kicker" style={{ color: 'var(--accent)' }}>ON THE LINE</span>
          </div>
          <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--ink)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {callInfo.phone || 'Calling...'}
          </div>
          <div className="mono" style={{ fontSize: 10.5, color: 'var(--ink-mid)', marginTop: 3, whiteSpace: 'nowrap' }}>
            {callInfo.elapsed} elapsed
          </div>
        </div>
      )}

      <div style={{ flex: 1 }} />
    </aside>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// Pages — Home
// ═══════════════════════════════════════════════════════════════════════

function HomePage({ onNew, onOpenCall, hasActiveCall, callInfo, callHistory }) {
  return (
    <div style={{ flex: 1, overflow: 'auto', padding: '36px 48px' }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between' }}>
        <div>
          <span className="kicker">{new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</span>
          <h1 style={{ margin: '6px 0 0', fontSize: 30, fontWeight: 500, letterSpacing: '-.02em' }}>
            Skip the hold, get <span className="serif-em">a human.</span>
          </h1>
        </div>
      </div>

      {hasActiveCall ? (
        <div onClick={onOpenCall} className="card" style={{
          marginTop: 24, padding: 26,
          background: 'linear-gradient(180deg, color-mix(in oklab, var(--accent) 6%, var(--paper)) 0%, var(--paper) 100%)',
          border: '.5px solid color-mix(in oklab, var(--accent) 30%, var(--rule))',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          gap: 24, cursor: 'pointer'
        }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <span className="dot" />
              <span className="kicker" style={{ color: 'var(--accent)' }}>ON THE LINE NOW</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
              <div style={{ fontSize: 17, color: 'var(--ink)', fontWeight: 500 }}>{callInfo.phone}</div>
              <span className="mono" style={{ fontSize: 12, color: 'var(--ink-mid)' }}>
                <Glyph k="clock" size={11} />&nbsp;&nbsp;{callInfo.elapsed} elapsed
              </span>
              <span className="mono" style={{ fontSize: 12, color: 'var(--ink-mid)' }}>{callInfo.status}</span>
            </div>
          </div>
          <button className="btn accent">
            <Glyph k="phone" size={13} />
            <span>Open live tracking</span>
            <Glyph k="chev" size={12} />
          </button>
        </div>
      ) : (
        <div className="card" onClick={onNew} style={{
          marginTop: 24, padding: 32, cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <div>
            <span className="kicker">Start something</span>
            <div style={{ marginTop: 8, fontSize: 22, color: 'var(--ink)' }}>
              Give us a number — we'll handle the menu maze.
            </div>
            <div style={{ marginTop: 4, fontSize: 13, color: 'var(--ink-mid)' }}>
              A bot calls, navigates the IVR, waits on hold, and connects you to a human.
            </div>
          </div>
          <button className="btn accent">
            <Glyph k="plus" size={13} />
            <span>New call</span>
          </button>
        </div>
      )}

      {callHistory.length > 0 && (
        <div style={{ marginTop: 32 }}>
          <span className="kicker">Recent calls</span>
          <div className="card" style={{ padding: '8px 18px', marginTop: 12 }}>
            {callHistory.map((h, i) => (
              <div key={i} style={{
                display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                padding: '14px 4px', borderBottom: i < callHistory.length - 1 ? '.5px solid var(--rule)' : 'none',
              }}>
                <div>
                  <div style={{ fontSize: 13.5, fontWeight: 500, color: 'var(--ink)' }}>{h.phone}</div>
                  <div className="mono" style={{ fontSize: 11, color: 'var(--ink-low)', marginTop: 2 }}>{h.reason || 'No reason given'}</div>
                </div>
                <div style={{ textAlign: 'right' }}>

// App
// ═══════════════════════════════════════════════════════════════════════

const PHASES = ['spawn','call','nav','hold','human','xfer'];

function App() {
  const [route, setRoute] = React.useState('home');
  const [callTab, setCallTab] = React.useState('transcript');

  // Call state
  const [hasActiveCall, setHasActiveCall] = React.useState(false);
  const [sessionId, setSessionId] = React.useState(null);
  const [messages, setMessages] = React.useState([]);
  const [phase, setPhase] = React.useState(null);
  const [elapsed, setElapsed] = React.useState('0:00');
  const [callPhone, setCallPhone] = React.useState('');
  const [callReason, setCallReason] = React.useState('');
  const [callStatus, setCallStatus] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [callHistory, setCallHistory] = React.useState([]);

  const startedAtRef = React.useRef(null);
  const eventSourceRef = React.useRef(null);
  const timerRef = React.useRef(null);

  // Load history and active calls from server on mount
  React.useEffect(() => {
    fetch('/history').then(r => r.ok ? r.json() : []).then(data => {
      setCallHistory(data.map(h => ({
        phone: h.phone,
        reason: h.reason,
        status: h.status,
        time: new Date(h.endedAt || h.startedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
      })));
    }).catch(() => {});

    // Check for active calls
    fetch('/active').then(r => r.ok ? r.json() : []).then(data => {
      if (data.length > 0) {
        const active = data[0];
        setHasActiveCall(true);
        setCallPhone(active.phone);
        setCallReason(active.reason || '');
        setCallStatus(active.status);
        setSessionId(active.sessionId);
        setPhase(active.status === 'calling' ? 'call' : active.status === 'in_progress' ? 'nav' : 'spawn');
        startedAtRef.current = active.startedAt;
        setBusy(true);
        startStream(active.sessionId);
      }
    }).catch(() => {});
  }, []);

  // Handle tracking link: /#call/sessionId — auto-connect to existing session
  React.useEffect(() => {
    const hash = window.location.hash;
    const match = hash.match(/^#call\/(.+)$/);
    if (match) {
      const sid = match[1];
      setSessionId(sid);
      setHasActiveCall(true);
      setCallPhone('(818) 448-9009');
      setCallStatus('Connecting to session...');
      setPhase('spawn');
      setRoute('call');
      setCallTab('transcript');
      startedAtRef.current = Date.now();
      // Fetch existing session state then start streaming
      fetch(`/sessions/${sid}`)
        .then(r => r.ok ? r.json() : Promise.reject('Session not found'))
        .then(data => {
          if (data.messages) {
            const mapped = data.messages.map(m => ({
              type: m.type, text: m.text || m.content || '',
              time: new Date(m.ts).toLocaleTimeString('en-US', { hour12: false }),
            }));
            setMessages(mapped);
          }
          setCallStatus(data.status || 'connected');
          if (data.status !== 'completed' && data.status !== 'error') {
            setBusy(true);
            startStream(sid);
          }
        })
        .catch(() => {
          addMessage('error', 'Could not connect to session ' + sid.slice(0, 8));
        });
    }
  }, []);

  // Duration timer
  React.useEffect(() => {
    if (hasActiveCall && startedAtRef.current) {
      timerRef.current = setInterval(() => {
        setElapsed(formatElapsed(Date.now() - startedAtRef.current));
      }, 1000);
      return () => clearInterval(timerRef.current);
    }
  }, [hasActiveCall]);

  // Phase inference
  const inferPhase = React.useCallback((text) => {
    const lc = (text || '').toLowerCase();
    if (lc.includes('transfer') && (lc.includes('success') || lc.includes('completed'))) setPhase('xfer');
    else if ((lc.includes('human') || lc.includes('representative')) && lc.includes('connected')) setPhase('human');
    else if (lc.includes('hold') || lc.includes('waiting') || lc.includes('queue')) setPhase('hold');
    else if (lc.includes('navigat') || lc.includes('ivr') || lc.includes('menu') || lc.includes('press')) setPhase('nav');
    else if (lc.includes('my name is') || lc.includes('how can i help') || lc.includes('how can i assist')) setPhase('human');
  }, []);

  const addMessage = React.useCallback((type, text) => {
    const time = new Date().toLocaleTimeString('en-US', { hour12: false });
    setMessages(prev => [...prev, { type, text, time }]);
  }, []);

  // Start SSE stream
  const startStream = React.useCallback((id) => {
    if (eventSourceRef.current) eventSourceRef.current.close();
    const es = new EventSource(`/sessions/${id}/stream`);
    eventSourceRef.current = es;

    es.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      switch (msg.type) {
        case 'assistant':
          addMessage('assistant', msg.text);
          inferPhase(msg.text);
          break;
        case 'transcript':
          if (msg.role === 'agent') {
            addMessage('assistant', msg.text);
            inferPhase(msg.text);
          } else if (msg.text && msg.text.includes('"status"')) {
            addMessage('tool_result', msg.text);
            setPhase(prev => (prev === 'call' || prev === 'spawn') ? 'nav' : prev);
          } else {
            addMessage('transcript', msg.text);
            inferPhase(msg.text);
          }
          break;
        case 'status':
          setCallStatus(msg.text);
          inferPhase(msg.text);
          break;
        case 'summary':
          addMessage('summary', msg.text);
          break;
        case 'recording':
          addMessage('recording', msg.text);
          break;
        case 'tool_call':
          addMessage('tool_call', `${msg.tool}: ${typeof msg.input === 'object' ? JSON.stringify(msg.input) : msg.input}`);
          if (msg.tool?.includes('call') && msg.tool?.includes('create')) setPhase('call');
          break;
        case 'tool_result':
          addMessage('tool_result', typeof msg.text === 'string' ? msg.text.slice(0, 500) : String(msg.text));
          inferPhase(msg.text);
          break;
        case 'result':
          addMessage('result', msg.text);
          break;
        case 'error':
          addMessage('error', msg.text);
          break;
      }
    };

    es.addEventListener('status', (e) => {
      const { status } = JSON.parse(e.data);
      setCallStatus(status);
      if (status === 'in_progress' || status === 'calling') {
        setPhase(prev => prev === 'spawn' ? 'call' : prev);
      }
    });

    es.addEventListener('done', (e) => {
      const { status } = JSON.parse(e.data);
      es.close();
      eventSourceRef.current = null;
      setBusy(false);
      clearInterval(timerRef.current);
      if (status === 'completed') {
        setPhase(prev => (prev !== 'xfer' && prev !== 'human') ? 'xfer' : prev);
      }
      // Refresh history from server
      fetch('/history').then(r => r.ok ? r.json() : []).then(data => {
        setCallHistory(data.map(h => ({
          phone: h.phone, reason: h.reason, status: h.status,
          time: new Date(h.endedAt || h.startedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
        })));
      }).catch(() => {});
      setCallStatus(status === 'completed' ? 'Done' : 'Failed');
    });

    es.onerror = () => {
      if (es.readyState === EventSource.CLOSED) {
        eventSourceRef.current = null;
        setBusy(false);
        clearInterval(timerRef.current);
      }
    };
  }, [addMessage, inferPhase, callPhone, callReason]);

  // Handle call submission
  const handleSubmit = React.useCallback(async (phone, reason) => {
    setBusy(true);
    setMessages([]);
    setPhase('spawn');
    setElapsed('0:00');
    setCallPhone('(818) 448-9009');
    setCallReason(reason);
    setCallStatus('Spawning agent');
    setHasActiveCall(true);
    setCallTab('transcript');
    setRoute('call');
    startedAtRef.current = Date.now();

    addMessage('system', `Spawning agent to call (818) 448-9009...`);

    try {
      const res = await fetch('/navigate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason }),
      });
      const data = await res.json();

      if (!res.ok) {
        addMessage('error', data?.error || 'Failed to spawn agent');
        setBusy(false);
        setPhase('error');
        return;
      }

      setSessionId(data.sessionId);
      addMessage('system', `Agent spawned — session ${data.sessionId.slice(0, 8)}`);
      startStream(data.sessionId);
    } catch (e) {
      addMessage('error', 'Network error: ' + e.message);
      setBusy(false);
      setPhase('error');
    }
  }, [addMessage, startStream]);

  const handleEndCall = React.useCallback(() => {
    if (eventSourceRef.current) {
      eventSourceRef.current.close();
      eventSourceRef.current = null;
    }
    clearInterval(timerRef.current);
    setBusy(false);
    setHasActiveCall(false);
    setPhase(null);
    setMessages([]);
    setRoute('home');
  }, []);

  const callInfo = { phone: callPhone, elapsed, status: callStatus };

  let content;
  switch (route) {
    case 'new':
      content = <RequestPage onSubmit={handleSubmit} busy={busy} />;
      break;
    case 'call':
      content = hasActiveCall ? (
        <>
          <CallHeader elapsed={elapsed} state={callStatus} phase={phase} onEnd={handleEndCall} />
          <Tabs active={callTab} onChange={setCallTab} tabs={[
            { id: 'transcript', label: 'Transcript', badge: busy ? 'live' : null, live: true },
          ]} />
          {callTab === 'transcript' && <TranscriptPage messages={messages} phase={phase} />}
        </>
      ) : (
        <EmptyCall onNew={() => setRoute('new')} />
      );
      break;
    case 'history':
      content = <HistoryPage callHistory={callHistory} />;
      break;
    case 'settings':
      content = <SettingsPage />;
      break;
    case 'home':
    default:
      content = (
        <HomePage
          hasActiveCall={hasActiveCall}
          callInfo={callInfo}
          callHistory={callHistory}
          onNew={() => setRoute('new')}
          onOpenCall={() => { setCallTab('transcript'); setRoute('call'); }}
        />
      );
  }

  return (
    <AppShell route={route} setRoute={setRoute} hasActiveCall={hasActiveCall} callInfo={callInfo}>
      {content}
    </AppShell>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
