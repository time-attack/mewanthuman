<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mewanthuman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #F1ECE0;
      --paper:    #FAF6EC;
      --paper-2:  #F5EFE0;
      --stone:    #E7DFCD;
      --rule:     #D8CEB6;
      --ink:      #1F1A14;
      --ink-2:    #3D352A;
      --ink-mid:  #7A6E5B;
      --ink-low:  #ADA28C;
      --accent:   #BE5A3F;
      --accent-2: #E2C28A;
      --moss:     #5B7048;
      --rose:     #C8967D;
      --success:  #5B7048;
      --warn:     #C58B2B;

      --sans:  "Geist", ui-sans-serif, system-ui, sans-serif;
      --mono:  "Geist Mono", ui-monospace, "SF Mono", monospace;
      --serif: "Instrument Serif", Georgia, serif;

      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 16px;
      --r-xl: 22px;

      --shadow-card: 0 1px 0 rgba(255,255,255,.6) inset, 0 1px 2px rgba(40,30,15,.04), 0 8px 28px -12px rgba(50,35,15,.18);
      --shadow-soft: 0 1px 2px rgba(40,30,15,.04), 0 14px 40px -18px rgba(50,35,15,.18);
    }

    html, body { margin: 0; padding: 0; background: var(--bg); height: 100%; overflow: hidden; }
    #root { height: 100vh; display: flex; flex-direction: column; }

    /* ── Shared atoms ── */
    .kicker {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ink-mid); white-space: nowrap;
    }
    .mono { font-family: var(--mono); }
    .serif-em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent); }
    .tnum { font-variant-numeric: tabular-nums; }
    .s { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 16px; border-radius: 999px;
      font-family: var(--sans); font-size: 13px; font-weight: 500;
      background: var(--ink); color: var(--paper);
      border: .5px solid var(--ink); cursor: pointer; white-space: nowrap;
    }
    .btn:hover { opacity: .9; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
    .btn.ghost:hover { border-color: var(--ink-mid); }
    .btn.accent { background: var(--accent); border-color: var(--accent); color: #FFF8EF; }
    .btn.accent:hover { filter: brightness(1.05); }
    .btn.sm { height: 28px; padding: 0 12px; font-size: 12px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 22px; padding: 0 9px; border-radius: 999px;
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em;
      background: var(--paper); color: var(--ink-2);
      border: .5px solid var(--rule); white-space: nowrap;
    }
    .chip.live { background: color-mix(in oklab, var(--accent) 14%, var(--paper)); color: var(--accent); border-color: color-mix(in oklab, var(--accent) 30%, var(--rule)); }
    .chip.ok { background: color-mix(in oklab, var(--success) 14%, var(--paper)); color: var(--success); border-color: color-mix(in oklab, var(--success) 30%, var(--rule)); }
    .chip.muted { color: var(--ink-mid); }

    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      animation: pulse 1.6s ease-out infinite; display: inline-block;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 50%, transparent); }
      100% { box-shadow: 0 0 0 8px color-mix(in oklab, var(--accent) 0%, transparent); }
    }

    .card {
      background: var(--paper); border: .5px solid var(--rule);
      border-radius: var(--r-lg); box-shadow: var(--shadow-card);
    }

    .rule { height: 1px; background: var(--rule); border: 0; margin: 0; }

    .logo {
      font-family: var(--sans); font-weight: 500; letter-spacing: -.01em;
      font-size: 15px; color: var(--ink); display: inline-flex; align-items: center; gap: 8px;
    }
    .logo .em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent); }
    .logo .mark {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--ink); position: relative; overflow: hidden;
    }
    .logo .mark::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 30% 30%, var(--accent) 0 32%, transparent 33%);
    }

    /* Text input */
    .text-input {
      width: 100%; background: var(--paper); border: .5px solid var(--rule);
      border-radius: var(--r-md); color: var(--ink); outline: none;
      font-family: var(--sans); font-size: 14px; padding: 12px 16px;
      transition: border-color .15s, box-shadow .15s;
    }
    .text-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 12%, transparent); }
    .text-input::placeholder { color: var(--ink-low); }
    textarea.text-input { resize: none; min-height: 92px; line-height: 1.55; }
    .text-input.mono-input { font-family: var(--mono); font-size: 18px; letter-spacing: .04em; }

    .spinner {
      width: 13px; height: 13px; border: 2px solid currentColor;
      border-top-color: transparent; border-radius: 50%;
      animation: spin .7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes dot-bounce { 0%,80%,100% { transform: translateY(0); opacity:.4; } 40% { transform: translateY(-3px); opacity:1; } }
    @keyframes wave { from { transform: scaleY(.6); } to { transform: scaleY(1.4); } }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

    /* ── Race / Dual-channel UI ── */
    @keyframes race-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(190,90,63,.15); }
      50% { box-shadow: 0 0 0 12px rgba(190,90,63,0); }
    }
    @keyframes winner-entrance {
      0% { transform: scale(.9); opacity: 0; }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes trophy-bounce {
      0%,100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-6px) rotate(-5deg); }
      75% { transform: translateY(-3px) rotate(3deg); }
    }
    @keyframes scan-line {
      0% { top: 0; }
      100% { top: 100%; }
    }
    .race-card { transition: border-color .3s, box-shadow .3s; }
    .race-card:hover { border-color: var(--ink-mid); }
    .race-card.winning {
      border-color: var(--success);
      box-shadow: 0 0 0 2px color-mix(in oklab, var(--success) 20%, transparent);
    }
    .race-card.active-channel {
      border-color: var(--accent);
      animation: race-glow 2s ease-in-out infinite;
    }
    .screenshot-frame {
      position: relative; overflow: hidden;
      border-radius: var(--r-md); border: .5px solid var(--rule);
      background: #1a1a1a;
    }
    .screenshot-frame img {
      width: 100%; height: auto; display: block;
      transition: opacity .3s;
    }
    .screenshot-frame::after {
      content: ""; position: absolute; left: 0; right: 0;
      height: 2px; background: color-mix(in oklab, var(--accent) 60%, transparent);
      animation: scan-line 3s linear infinite;
      pointer-events: none;
    }

    /* App-level layout handled in React inline styles */
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
// ═══════════════════════════════════════════════════════════════════════
// Utility
// ═══════════════════════════════════════════════════════════════════════

function toE164(raw) {
  const s = raw.replace(/[\s\(\)\-\.]/g, '');
  if (/^\+\d{11,}$/.test(s)) return s;
  const d = s.replace(/\D/g, '');
  if (d.length === 10) return '+1' + d;
  if (d.length === 11 && d[0] === '1') return '+' + d;
  return null;
}

function formatElapsed(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// ═══════════════════════════════════════════════════════════════════════
// Icons
// ═══════════════════════════════════════════════════════════════════════

function Glyph({ k, size = 14 }) {
  const c = "s";
  switch (k) {
    case "plus":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M12 5v14M5 12h14"/></svg>;
    case "phone":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M5 4h4l2 5-2 1a11 11 0 0 0 5 5l1-2 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>;
    case "check":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="m5 12 5 5 9-11"/></svg>;
    case "wave":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M3 12h2l2-6 3 12 3-9 3 6 2-3h3"/></svg>;
    case "clock":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>;
    case "chev":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="m9 6 6 6-6 6"/></svg>;
    case "down":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="m6 9 6 6 6-6"/></svg>;
    case "search":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg>;
    case "settings":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><circle cx="12" cy="12" r="3"/><path d="M19 12c0 .7-.1 1.3-.2 2l2 1.5-2 3.4-2.4-1c-1 .8-2.1 1.4-3.4 1.6L13 22h-4l-.4-2.5c-1.3-.2-2.4-.8-3.4-1.6l-2.4 1-2-3.4 2-1.5C2.6 13.3 2.5 12.7 2.5 12s.1-1.3.2-2l-2-1.5 2-3.4 2.4 1c1-.8 2.1-1.4 3.4-1.6L9 2h4l.4 2.5c1.3.2 2.4.8 3.4 1.6l2.4-1 2 3.4-2 1.5c.1.7.2 1.3.2 2Z"/></svg>;
    case "bell":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 7H4c0-1 2-2 2-7ZM10 20a2 2 0 0 0 4 0"/></svg>;
    case "chat":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-6.4-2.6L3 21l2.6-2.6A9 9 0 1 1 21 12Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>;
    case "trophy":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M6 9H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3M18 9h3a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-3M6 4h12v6a6 6 0 0 1-12 0V4ZM9 20h6M12 16v4"/></svg>;
    case "globe":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 4 9 15 15 0 0 1-4 9 15 15 0 0 1-4-9 15 15 0 0 1 4-9Z"/></svg>;
    case "zap":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>;
    case "flag":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1ZM4 22v-7"/></svg>;
    case "book":
      return <svg width={size} height={size} viewBox="0 0 24 24" className={c}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>;
    default: return null;
  }
}

function SideIcon({ k }) {
  const c = "s";
  switch (k) {
    case 'home':
      return <svg width="14" height="14" viewBox="0 0 24 24" className={c}><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-7h-6v7H5a1 1 0 0 1-1-1v-9Z" /></svg>;
    case 'phone':
      return <svg width="14" height="14" viewBox="0 0 24 24" className={c}><path d="M5 4h4l2 5-2 1a11 11 0 0 0 5 5l1-2 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z" /></svg>;
    case 'history':
      return <svg width="14" height="14" viewBox="0 0 24 24" className={c}><circle cx="12" cy="12" r="8" /><path d="M12 7v5l3 2M5 4 3 6M19 4l2 2" /></svg>;
    case 'building':
      return <svg width="14" height="14" viewBox="0 0 24 24" className={c}><rect x="4" y="3" width="16" height="18" rx="1.5" /><path d="M9 21V14h6v7M9 7h.01M12 7h.01M15 7h.01M9 11h.01M12 11h.01M15 11h.01" /></svg>;
    case 'settings':
      return <svg width="14" height="14" viewBox="0 0 24 24" className={c}><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.5 5.5l2 2M16.5 16.5l2 2M5.5 18.5l2-2M16.5 7.5l2-2"/></svg>;
    default: return null;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// Shared Components
// ═══════════════════════════════════════════════════════════════════════

function Logo({ size = 15 }) {
  return (
    <span className="logo" style={{ fontSize: size }}>
      <span className="mark" style={{ width: size + 3, height: size + 3 }} />
      <span>me<span className="em">want</span>human</span>
    </span>
  );
}

function CompanyAvatar({ name = "Delta", color = "#BE5A3F", subtitle, big = false }) {
  const initial = (name || "?").trim()[0]?.toUpperCase() ?? "?";
  const sz = big ? 44 : 32;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
      <div style={{
        width: sz, height: sz, borderRadius: 10,
        background: color, color: '#FFF8EF',
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'var(--serif)', fontStyle: 'italic',
        fontSize: big ? 22 : 16,
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,.2)'
      }}>{initial}</div>
      <div>
        <div style={{ fontSize: big ? 16 : 13.5, fontWeight: 500, color: 'var(--ink)' }}>{name}</div>
        {subtitle && <div style={{ fontSize: 11.5, color: 'var(--ink-mid)', fontFamily: 'var(--mono)' }}>{subtitle}</div>}
      </div>
    </div>
  );
}

function Tabs({ tabs, active, onChange }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 0,
      padding: '0 28px', borderBottom: '.5px solid var(--rule)',
      background: 'var(--paper-2)', flex: '0 0 auto',
    }}>
      {tabs.map(t => {
        const isActive = t.id === active;
        return (
          <button key={t.id} onClick={() => onChange(t.id)} style={{
            padding: '12px 14px', border: 0, background: 'transparent',
            cursor: 'pointer',
            borderBottom: '2px solid ' + (isActive ? 'var(--ink)' : 'transparent'),
            marginBottom: -1,
            color: isActive ? 'var(--ink)' : 'var(--ink-mid)',
            fontFamily: 'var(--sans)', fontSize: 12.5,
            fontWeight: isActive ? 500 : 400,
            display: 'inline-flex', alignItems: 'center', gap: 8,
            whiteSpace: 'nowrap',
          }}>
            <span>{t.label}</span>
            {t.badge && <span style={{
              fontFamily: 'var(--mono)', fontSize: 10,
              padding: '1px 7px', borderRadius: 999,
              background: t.live ? 'color-mix(in oklab, var(--accent) 14%, var(--paper))' : 'var(--stone)',
              color: t.live ? 'var(--accent)' : 'var(--ink-mid)',
              border: '.5px solid ' + (t.live ? 'color-mix(in oklab, var(--accent) 30%, var(--rule))' : 'transparent'),
            }}>{t.badge}</span>}
          </button>
        );
      })}
    </div>
  );
}

function FormBlock({ label, hint, children }) {
  return (
    <div style={{ marginTop: 24 }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 8 }}>
        <span style={{ fontSize: 12, color: 'var(--ink)', fontWeight: 500 }}>{label}</span>
        {hint && <span style={{ fontSize: 11.5, color: 'var(--ink-mid)' }}>{hint}</span>}
      </div>
      {children}
    </div>
  );
}

function Legend({ dot, label }) {
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
    <span style={{ width: 6, height: 6, borderRadius: '50%', background: dot }} /> {label}
  </span>;
}

// ═══════════════════════════════════════════════════════════════════════
// App Shell
// ═══════════════════════════════════════════════════════════════════════

function AppShell({ route, setRoute, hasActiveCall, callInfo, children }) {
  return (
    <div style={{ flex: 1, display: 'flex', minHeight: 0, fontFamily: 'var(--sans)', color: 'var(--ink)' }}>
      <Sidebar route={route} setRoute={setRoute} hasActiveCall={hasActiveCall} callInfo={callInfo} />
      <main style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: 'var(--bg)', overflow: 'hidden' }}>
        {children}
      </main>
    </div>
  );
}

function Sidebar({ route, setRoute, hasActiveCall, callInfo }) {
  const items = [
    { id: 'home',      label: 'Home',        icon: 'home' },
    { id: 'call',      label: 'Active call',  icon: 'phone', badge: hasActiveCall ? '1' : null, accent: hasActiveCall },
    { id: 'history',   label: 'History',      icon: 'history' },
    { id: 'playbooks', label: 'Playbooks',     icon: 'building' },
    { id: 'settings',  label: 'Settings',     icon: 'settings' },
  ];

  return (
    <aside style={{
      width: 232, flex: '0 0 232px',
      background: 'var(--paper-2)', borderRight: '.5px solid var(--rule)',
      display: 'flex', flexDirection: 'column', padding: '22px 16px 18px',
    }}>
      <div style={{ padding: '0 8px 16px' }}><Logo size={15} /></div>

      <button onClick={() => setRoute('new')} className="btn accent"
        style={{ width: '100%', justifyContent: 'flex-start', marginBottom: 22, height: 38, padding: '0 12px', fontSize: 13 }}>
        <Glyph k="plus" size={14} />
        <span>New call</span>
      </button>

      <nav style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
        {items.map(it => {
          const active = route === it.id || (it.id === 'call' && route === 'new');
          return (
            <button key={it.id} onClick={() => setRoute(it.id)} style={{
              display: 'flex', alignItems: 'center', gap: 10,
              padding: '8px 10px', borderRadius: 'var(--r-sm)',
              background: active ? 'var(--bg)' : 'transparent',
              border: '.5px solid ' + (active ? 'var(--rule)' : 'transparent'),
              color: active ? 'var(--ink)' : 'var(--ink-mid)',
              fontFamily: 'var(--sans)', fontSize: 13,
              fontWeight: active ? 500 : 400, cursor: 'pointer', textAlign: 'left',
              whiteSpace: 'nowrap',
            }}>
              <SideIcon k={it.icon} />
              <span>{it.label}</span>
              <span style={{ flex: 1 }} />
              {it.badge && (
                <span style={{
                  fontFamily: 'var(--mono)', fontSize: 10.5,
                  padding: '2px 7px', borderRadius: 999,
                  background: it.accent ? 'var(--accent)' : 'var(--stone)',
                  color: it.accent ? '#FFF8EF' : 'var(--ink-2)',
                  display: 'inline-flex', alignItems: 'center', gap: 5,
                }}>
                  {it.accent && <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#FFF8EF', display: 'inline-block' }} />}
                  {it.badge}
                </span>
              )}
            </button>
          );
        })}
      </nav>

      {hasActiveCall && (
        <div onClick={() => setRoute('call')} style={{
          marginTop: 22, padding: 12,
          background: 'var(--paper)',
          border: '.5px solid color-mix(in oklab, var(--accent) 30%, var(--rule))',
          borderRadius: 'var(--r-md)', cursor: 'pointer',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
            <span className="dot" />
            <span className="kicker" style={{ color: 'var(--accent)' }}>ON THE LINE</span>
          </div>
          <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--ink)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {callInfo.phone || 'Calling...'}
          </div>
          <div className="mono" style={{ fontSize: 10.5, color: 'var(--ink-mid)', marginTop: 3, whiteSpace: 'nowrap' }}>
            {callInfo.elapsed} elapsed
          </div>
        </div>
      )}

      <div style={{ flex: 1 }} />
    </aside>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// Pages — Home
// ═══════════════════════════════════════════════════════════════════════

function HomePage({ onNew, onOpenCall, hasActiveCall, callInfo, callHistory }) {
  return (

      }}>

function RequestPage({ onSubmit, busy }) {
  const [phone, setPhone] = React.useState('');
  const [reason, setReason] = React.useState('');
  const [channels, setChannels] = React.useState({ phone: true, webchat: true }); // both on by default

  const formatted = React.useMemo(() => {
    const d = phone.replace(/\D/g, '').slice(0, 10);
    if (d.length <= 3) return d;
    if (d.length <= 6) return `(${d.slice(0,3)}) ${d.slice(3)}`;
    return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  }, [phone]);

  const digits = phone.replace(/\D/g, '');
  const isValid = digits.length === 10;
  const hasChannel = channels.phone || channels.webchat;

  const toggleChannel = (ch) => {
    setChannels(prev => {
      const next = { ...prev, [ch]: !prev[ch] };
      // At least one must be on
      if (!next.phone && !next.webchat) return prev;
      return next;
    });
  };

  const handleSubmit = () => {
    if (!isValid || !hasChannel) return;
    onSubmit(digits, reason.trim(), channels);
  };

  const modeLabel = channels.phone && channels.webchat ? 'DUAL-CHANNEL RACE' : channels.phone ? 'PHONE ONLY' : 'WEB CHAT ONLY';

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: '32px 48px 28px', maxWidth: 680 }}>
      <div className="kicker" style={{ color: 'var(--ink-low)' }}>{modeLabel}</div>
      <h1 style={{ fontSize: 30, margin: '10px 0 4px', fontWeight: 500, letterSpacing: '-.02em' }}>
        Who do you need to <span className="serif-em">reach?</span>
      </h1>
      <p style={{ color: 'var(--ink-mid)', fontSize: 13.5, margin: 0, maxWidth: 520 }}>
        {channels.phone && channels.webchat
          ? 'Two AI agents will race — one calls, the other finds the live web chat. First to a human wins.'
          : channels.phone
          ? 'An AI agent will call this number, navigate the IVR, and connect you to a human.'
          : 'An AI browser agent will find the company\'s live chat and reach a human for you.'}
      </p>

      <FormBlock label="Phone number" hint={isValid ? '' : digits.length > 0 ? `${10 - digits.length} digits left` : ''}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 10,
          padding: '4px 16px', background: 'var(--paper)', border: '.5px solid var(--rule)',
          borderRadius: 'var(--r-md)',
        }}>
          <span className="mono" style={{ color: 'var(--ink-mid)', fontSize: 13 }}>+1</span>
          <span style={{ width: 1, height: 16, background: 'var(--rule)' }} />
          <input
            className="text-input mono-input"
            style={{ border: 'none', padding: '12px 0', background: 'transparent', flex: 1 }}
            type="tel"
            placeholder="(555) 123-4567"
            value={formatted}
            onChange={(e) => setPhone(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter' && isValid) handleSubmit(); }}
            autoFocus
          />
          {isValid && <span className="chip ok"><Glyph k="check" size={10} />&nbsp;Ready</span>}
        </div>
      </FormBlock>

      <FormBlock label="Channels" hint="Pick one or both">
        <div style={{ display: 'flex', gap: 10 }}>
          <ChannelToggle
            id="phone" icon="phone" label="Phone Call" desc="Call & navigate IVR"
            active={channels.phone} onClick={() => toggleChannel('phone')}
            color="var(--accent)"
          />
          <ChannelToggle
            id="webchat" icon="chat" label="Web Chat" desc="browser-use finds live chat"
            active={channels.webchat} onClick={() => toggleChannel('webchat')}
            color="#5B8DEF"
          />
        </div>
      </FormBlock>

      <FormBlock label="What do you need" hint="A sentence is plenty">
        <textarea className="text-input" placeholder="e.g. dispute a charge, cancel my subscription, rebook a flight..."
          value={reason} onChange={(e) => setReason(e.target.value)} />
      </FormBlock>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', marginTop: 24, gap: 8 }}>
        <button className="btn accent" onClick={handleSubmit} disabled={busy || !isValid}>
          {busy ? (
            <><span className="spinner" /><span>{channels.phone && channels.webchat ? 'Racing...' : 'Working...'}</span></>
          ) : (
            <><Glyph k={channels.phone && channels.webchat ? 'zap' : channels.phone ? 'phone' : 'chat'} size={13} />
            <span>{channels.phone && channels.webchat ? 'Start race' : channels.phone ? 'Place call' : 'Start chat'}</span></>
          )}
        </button>
      </div>
    </div>
  );
}

function TranscriptPage({ messages, phase }) {
  const scrollRef = React.useRef(null);
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages.length]);

  return (
    <div style={{ flex: 1, display: 'flex', minHeight: 0, overflow: 'hidden' }}>
      <div ref={scrollRef} style={{ flex: 1, padding: '20px 36px 24px', overflowY: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12 }}>
          <span className="kicker">Live transcript</span>
          <div style={{ display: 'flex', gap: 12, fontSize: 11.5, color: 'var(--ink-mid)' }}>
            <Legend dot="var(--ink)" label="Phone" />
            <Legend dot="var(--accent)" label="Bot" />
            <Legend dot="var(--ink-low)" label="System" />
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
          {messages.map((m, i) => <TxLine key={i} m={m} />)}
          {phase && phase !== 'completed' && phase !== 'error' && <TypingIndicator phase={phase} />}
        </div>
        {messages.length === 0 && (
          <div style={{ padding: '40px 0', textAlign: 'center', color: 'var(--ink-low)', fontSize: 13 }}>
            Waiting for agent to connect...
          </div>
        )}
      </div>

      <aside style={{ width: 320, borderLeft: '.5px solid var(--rule)', background: 'var(--paper)', padding: '20px 22px', overflowY: 'auto' }}>
        <span className="kicker">Agent progress</span>
        <div style={{ marginTop: 14, display: 'flex', flexDirection: 'column', gap: 6 }}>
          {[
            { id: 'spawn', label: 'Spawning agent' },
            { id: 'call', label: 'Placing call' },
            { id: 'nav', label: 'Navigating IVR' },
            { id: 'hold', label: 'On hold' },
            { id: 'human', label: 'Human reached' },
            { id: 'xfer', label: 'Transferred to you' },
          ].map(p => {
            const PHASES = ['spawn','call','nav','hold','human','xfer'];
            const curIdx = PHASES.indexOf(phase);
            const thisIdx = PHASES.indexOf(p.id);
            const isDone = thisIdx < curIdx;
            const isActive = thisIdx === curIdx;
            const isSuccess = isActive && (p.id === 'human' || p.id === 'xfer');
            return (
              <div key={p.id} style={{
                display: 'flex', alignItems: 'center', gap: 10,
                padding: '9px 12px', borderRadius: 'var(--r-sm)',
                background: isSuccess ? 'color-mix(in oklab, var(--success) 10%, var(--paper))'
                  : isActive ? 'color-mix(in oklab, var(--accent) 8%, var(--paper))'
                  : 'transparent',
                border: '.5px solid ' + (isSuccess ? 'color-mix(in oklab, var(--success) 30%, var(--rule))'
                  : isActive ? 'color-mix(in oklab, var(--accent) 20%, var(--rule))'
                  : 'transparent'),
                opacity: isDone ? .5 : isActive ? 1 : .3,
              }}>
                <span style={{
                  width: 7, height: 7, borderRadius: '50%', flexShrink: 0,
                  background: isSuccess ? 'var(--success)' : isActive ? 'var(--accent)' : isDone ? 'var(--ink-mid)' : 'var(--rule)',
                  animation: isActive && !isSuccess ? 'pulse 1.6s ease-out infinite' : 'none',
                }} />
                <span style={{
                  fontSize: 12.5,
                  color: isSuccess ? 'var(--success)' : isActive ? 'var(--accent)' : 'var(--ink-mid)',
                  fontWeight: isActive ? 500 : 400,
                }}>{p.label}</span>
              </div>
            );
          })}
        </div>

        <div style={{ marginTop: 22, padding: '12px 14px', background: 'var(--bg)', borderRadius: 'var(--r-md)', border: '.5px dashed var(--rule)' }}>
          <span className="kicker" style={{ color: 'var(--accent)' }}>DUAL-CHANNEL RACE</span>
          <p style={{ margin: '6px 0 0', fontSize: 12.5, color: 'var(--ink-2)', lineHeight: 1.5 }}>
            Two agents are competing: one calls the number and navigates the IVR, while browser-use powers a second agent racing to reach a human via web chat. Switch to the Race tab to see both channels live.
          </p>
        </div>
      </aside>
    </div>
  );
}

function TxLine({ m }) {
  const configs = {
    assistant:    { label: 'AGENT',  color: 'var(--accent)', bg: 'color-mix(in oklab, var(--accent) 7%, var(--paper))' },
    transcript:   { label: 'PHONE',  color: 'var(--ink)',    bg: 'transparent' },
    status:       { label: 'STATUS', color: 'var(--ink-low)', bg: 'transparent' },
    tool_call:    { label: 'TOOL',   color: 'var(--accent)', bg: 'transparent' },
    tool_result:  { label: 'RESULT', color: 'var(--ink-low)', bg: 'transparent' },
    summary:      { label: 'DONE',   color: 'var(--success)', bg: 'color-mix(in oklab, var(--success) 7%, var(--paper))' },
    recording:    { label: 'REC',    color: 'var(--ink-mid)', bg: 'transparent' },
    result:       { label: 'DONE',   color: 'var(--success)', bg: 'color-mix(in oklab, var(--success) 7%, var(--paper))' },
    error:        { label: 'ERROR',  color: '#9C2828',       bg: 'color-mix(in oklab, #9C2828 7%, var(--paper))' },
    system:       { label: 'SYS',    color: 'var(--ink-low)', bg: 'transparent' },
  };
  const cfg = configs[m.type] || configs.system;

  return (
    <div style={{
      display: 'grid', gridTemplateColumns: '54px 50px 1fr',
      gap: 14, alignItems: 'baseline',
      padding: '10px 12px', background: cfg.bg, borderRadius: 'var(--r-sm)',
      borderLeft: m.type === 'status' ? '2px solid var(--accent)' : '2px solid transparent',
    }}>
      <span className="mono" style={{ fontSize: 11, color: 'var(--ink-low)' }}>{m.time}</span>
      <span className="mono" style={{ fontSize: 10.5, color: cfg.color, letterSpacing: '.08em' }}>{cfg.label}</span>
      <span style={{ fontSize: 13.5, color: 'var(--ink-2)', lineHeight: 1.5, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
        {m.text}
      </span>
    </div>
  );
}

function TypingIndicator({ phase }) {

    spawn: 'Spawning agent',

function ChannelProgressSteps({ channel, phase, webchatStatus }) {
  if (channel === 'phone') {
    const steps = [
      { id: 'spawn', label: 'Spawning agent' },
      { id: 'call', label: 'Placing call' },
      { id: 'nav', label: 'Navigating IVR' },
      { id: 'hold', label: 'On hold' },
      { id: 'human', label: 'Human reached' },
    ];
    const PHASES = ['spawn','call','nav','hold','human'];
    const curIdx = PHASES.indexOf(phase);
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
        {steps.map((s, i) => {
          const isDone = i < curIdx;
          const isActive = i === curIdx;
          const isSuccess = isActive && s.id === 'human';
          return (
            <div key={s.id} style={{
              display: 'flex', alignItems: 'center', gap: 8,
              padding: '6px 10px', borderRadius: 'var(--r-sm)',
              background: isSuccess ? 'color-mix(in oklab, var(--success) 10%, transparent)' : 'transparent',
              opacity: isDone ? .45 : isActive ? 1 : .25,
            }}>
              <span style={{
                width: 6, height: 6, borderRadius: '50%', flexShrink: 0,
                background: isSuccess ? 'var(--success)' : isActive ? 'var(--accent)' : isDone ? 'var(--ink-mid)' : 'var(--rule)',
                animation: isActive && !isSuccess ? 'pulse 1.6s ease-out infinite' : 'none',
              }} />
              <span style={{ fontSize: 12, color: isSuccess ? 'var(--success)' : isActive ? 'var(--accent)' : 'var(--ink-mid)', fontWeight: isActive ? 500 : 400 }}>
                {s.label}
              </span>
            </div>
          );
        })}
      </div>
    );
  }
  // Webchat channel
  const wcSteps = [
    { id: 'starting', label: 'Launching browser' },
    { id: 'browsing', label: 'Finding company chat' },
    { id: 'chatting', label: 'Chatting with support' },
    { id: 'human_reached', label: 'Human reached' },
  ];
  const WC_PHASES = ['starting','browsing','chatting','human_reached'];
  const wcIdx = WC_PHASES.indexOf(webchatStatus || 'starting');
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      {wcSteps.map((s, i) => {
        const isDone = i < wcIdx;
        const isActive = i === wcIdx;
        const isSuccess = isActive && s.id === 'human_reached';
        return (
          <div key={s.id} style={{
            display: 'flex', alignItems: 'center', gap: 8,
            padding: '6px 10px', borderRadius: 'var(--r-sm)',
            background: isSuccess ? 'color-mix(in oklab, var(--success) 10%, transparent)' : 'transparent',
            opacity: isDone ? .45 : isActive ? 1 : .25,
          }}>
            <span style={{
              width: 6, height: 6, borderRadius: '50%', flexShrink: 0,
              background: isSuccess ? 'var(--success)' : isActive ? '#5B8DEF' : isDone ? 'var(--ink-mid)' : 'var(--rule)',
              animation: isActive && !isSuccess ? 'pulse 1.6s ease-out infinite' : 'none',
            }} />
            <span style={{ fontSize: 12, color: isSuccess ? 'var(--success)' : isActive ? '#5B8DEF' : 'var(--ink-mid)', fontWeight: isActive ? 500 : 400 }}>
              {s.label}
            </span>
          </div>
        );
      })}
    </div>
  );
}

function RaceView({ messages, phase, webchatStatus, webchatActions, raceWinner, sessionId, screenshotTs, liveUrl, lastScreenshotUrl }) {
  const phoneMessages = messages.filter(m => !m.channel || m.channel === 'phone');
  const chatMessages = messages.filter(m => m.channel === 'webchat');
  const phoneScrollRef = React.useRef(null);

  React.useEffect(() => {
    if (phoneScrollRef.current) phoneScrollRef.current.scrollTop = phoneScrollRef.current.scrollHeight;
  }, [phoneMessages.length]);
  React.useEffect(() => {
    if (chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
  }, [chatMessages.length]);

  const phoneWon = raceWinner === 'phone';
  const chatWon = raceWinner === 'webchat';

  return (
    <div style={{ flex: 1, display: 'flex', minHeight: 0, overflow: 'hidden' }}>
      {/* ── Phone Channel ── */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', borderRight: '.5px solid var(--rule)', minWidth: 0 }}>
        <div style={{
          padding: '14px 20px', borderBottom: '.5px solid var(--rule)',

          display: 'flex', alignItems: 'center', gap: 10,

          <div style={{
            width: 28, height: 28, borderRadius: 8,

              {phoneWon ? 'WINNER' : phase || 'starting'}

      {/* ── VS Divider ── */}

          boxShadow: '0 2px 8px rgba(0,0,0,.15)',

          {raceWinner ? <Glyph k="check" size={16} /> : 'vs'}
        </div>
        <span className="mono" style={{ fontSize: 9, color: 'var(--ink-low)', letterSpacing: '.1em' }}>RACE</span>
      </div>

      {/* ── Web Chat Channel ── */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
        <div style={{
          padding: '14px 20px', borderBottom: '.5px solid var(--rule)',
          background: chatWon ? 'color-mix(in oklab, var(--success) 8%, var(--paper))' : 'var(--paper-2)',
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <div style={{
            width: 28, height: 28, borderRadius: 8,
            background: chatWon ? 'var(--success)' : '#5B8DEF',

          }}>
            <Glyph k="chat" size={13} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink)' }}>Web Chat</div>
            <div className="mono" style={{ fontSize: 10.5, color: 'var(--ink-mid)' }}>
              {chatWon ? 'WINNER' : webchatStatus || 'starting'}
            </div>
          </div>
          {chatWon && <span className="chip ok" style={{ fontSize: 10 }}><Glyph k="trophy" size={10} /> Winner</span>}
          {!raceWinner && webchatStatus && !['completed','error','idle'].includes(webchatStatus) && (
            <span className="dot" style={{ background: '#5B8DEF' }} />

        </div>
        <div style={{ padding: '8px 14px', borderBottom: '.5px solid var(--rule)', background: 'var(--paper)' }}>

        <div style={{ padding: '12px 14px', borderBottom: '.5px solid var(--rule)' }}>
          <div className="screenshot-frame" style={{ height: 200 }}>

              <iframe
                src={liveUrl}
                style={{ width: '100%', height: '100%', border: 'none' }}

              <img src={lastScreenshotUrl} alt="Browser screenshot" style={{ objectFit: 'cover', maxHeight: 200, width: '100%' }} />
            ) : (
              <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ink-low)', fontSize: 12, gap: 8 }}>
                <span className="spinner" /> Waiting for cloud browser...
              </div>
            )}
          </div>
          <div className="mono" style={{ fontSize: 10, color: 'var(--ink-low)', marginTop: 6, textAlign: 'center' }}>

        </div>
        <div ref={chatScrollRef} style={{ flex: 1, overflowY: 'auto', padding: '12px 16px' }}>
          {chatMessages.map((m, i) => <MiniTxLine key={i} m={m} channel="webchat" />)}

            <div style={{ padding: '30px 0', textAlign: 'center', color: 'var(--ink-low)', fontSize: 12 }}>
              Launching browser agent...
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function MiniTxLine({ m, channel }) {
  const isChat = channel === 'webchat';
  const typeColor = {
    webchat_status: '#5B8DEF',
    webchat_action: '#5B8DEF',
    webchat_thought: 'var(--ink-mid)',
    webchat_screenshot: 'var(--ink-low)',
    webchat_human: 'var(--success)',
    webchat_error: '#9C2828',
    race_winner: 'var(--success)',
    assistant: 'var(--accent)',
    transcript: 'var(--ink)',
    status: 'var(--ink-low)',
    summary: 'var(--success)',
    error: '#9C2828',
    system: 'var(--ink-low)',
  };
  const typeLabel = {
    webchat_status: 'STATUS',
    webchat_action: 'ACTION',
    webchat_thought: 'THINK',
    webchat_screenshot: 'SNAP',
    webchat_human: 'HUMAN!',
    webchat_error: 'ERROR',
    race_winner: 'WINNER',
    assistant: 'BOT',
    transcript: 'PHONE',
    status: 'SYS',
    summary: 'DONE',
    error: 'ERROR',
    system: 'SYS',
  };
  const color = typeColor[m.type] || 'var(--ink-mid)';
  const label = typeLabel[m.type] || m.type?.toUpperCase()?.slice(0,6) || 'MSG';

  // Don't show screenshot events in log
  if (m.type === 'webchat_screenshot') return null;

  return (
    <div style={{
      display: 'flex', alignItems: 'baseline', gap: 8,
      padding: '5px 6px', fontSize: 12, lineHeight: 1.45,
      borderRadius: 4,
      background: m.type === 'race_winner' ? 'color-mix(in oklab, var(--success) 8%, transparent)' : 'transparent',
    }}>
      <span className="mono" style={{ fontSize: 10, color: 'var(--ink-low)', flexShrink: 0, width: 44 }}>{m.time}</span>
      <span className="mono" style={{ fontSize: 9.5, color, letterSpacing: '.06em', flexShrink: 0, width: 44 }}>{label}</span>
      <span style={{ color: 'var(--ink-2)', wordBreak: 'break-word' }}>
        {(m.text || '').length > 200 ? m.text.slice(0, 200) + '...' : m.text}
      </span>
    </div>
  );
}

// Pages — Playbooks (supermemory-backed webchat navigation steps)
// ═══════════════════════════════════════════════════════════════════════

function PlaybooksPage() {
  const [playbooks, setPlaybooks] = React.useState([]);
  const [searchQuery, setSearchQuery] = React.useState('');
  const [searchResults, setSearchResults] = React.useState(null);
  const [searching, setSearching] = React.useState(false);
  const [showAdd, setShowAdd] = React.useState(false);
  const [saving, setSaving] = React.useState(false);
  const [form, setForm] = React.useState({ company: '', url: '', phone: '', steps: '', notes: '' });

  const handleSearch = async () => {
    if (!searchQuery.trim()) return;
    setSearching(true);
    try {
      const res = await fetch('/playbooks/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: searchQuery, limit: 10 }),
      });
      const data = await res.json();
      setSearchResults(data.results || []);
    } catch { setSearchResults([]); }
    setSearching(false);
  };

  const handleSave = async () => {
    if (!form.company || !form.steps) return;
    setSaving(true);
    try {
      await fetch('/playbooks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(form),
      });
      setForm({ company: '', url: '', phone: '', steps: '', notes: '' });
      setShowAdd(false);
    } catch {}
    setSaving(false);
  };

  const inputStyle = {
    width: '100%', padding: '10px 12px', fontSize: 13,
    fontFamily: 'var(--sans)', background: 'var(--paper)',
    border: '.5px solid var(--rule)', borderRadius: 'var(--r-sm)',
    color: 'var(--ink)', outline: 'none',
  };

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: '36px 48px', maxWidth: 800 }}>
      <span className="kicker">Navigation memory</span>
      <h1 style={{ margin: '6px 0 8px', fontSize: 28, fontWeight: 500, letterSpacing: '-.02em' }}>Playbooks</h1>
      <p style={{ fontSize: 13, color: 'var(--ink-mid)', marginBottom: 24, lineHeight: 1.5 }}>
        Stored steps for reaching live chat on company websites. The browser agent checks these before searching from scratch.
      </p>

      {/* Search bar */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 20 }}>
        <input
          value={searchQuery}
          onChange={e => setSearchQuery(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && handleSearch()}
          placeholder="Search by company, phone, or keyword..."
          style={{ ...inputStyle, flex: 1 }}
        />
        <button className="btn" onClick={handleSearch} disabled={searching}>
          {searching ? 'Searching...' : 'Search'}
        </button>
        <button className="btn accent" onClick={() => setShowAdd(!showAdd)}>
          <Glyph k="plus" size={14} />
          Add
        </button>
      </div>

      {/* Add playbook form */}
      {showAdd && (
        <div className="card" style={{ padding: 20, marginBottom: 20 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
            <span style={{ fontSize: 14, fontWeight: 500 }}>New playbook</span>
            <button className="btn ghost sm" onClick={() => setShowAdd(false)}>Cancel</button>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 12 }}>
            <div>
              <label style={{ fontSize: 11, color: 'var(--ink-mid)', display: 'block', marginBottom: 4 }}>Company *</label>
              <input style={inputStyle} value={form.company} onChange={e => setForm({...form, company: e.target.value})} placeholder="e.g. Comcast" />
            </div>
            <div>
              <label style={{ fontSize: 11, color: 'var(--ink-mid)', display: 'block', marginBottom: 4 }}>Phone</label>
              <input style={inputStyle} value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} placeholder="+18001234567" />
            </div>
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: 'var(--ink-mid)', display: 'block', marginBottom: 4 }}>Support URL</label>
            <input style={inputStyle} value={form.url} onChange={e => setForm({...form, url: e.target.value})} placeholder="https://support.company.com/contact" />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: 'var(--ink-mid)', display: 'block', marginBottom: 4 }}>Steps to reach live chat *</label>
            <textarea
              style={{ ...inputStyle, minHeight: 120, fontFamily: 'var(--mono)', fontSize: 12, resize: 'vertical' }}
              value={form.steps}
              onChange={e => setForm({...form, steps: e.target.value})}
              placeholder={"1. Go to support.company.com/contact\n2. Click 'Chat with us' button in bottom-right\n3. Select 'Billing' from the dropdown\n4. Type 'I need to speak with a human'\n5. Click 'Talk to a person' when offered"}
            />
          </div>
          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 11, color: 'var(--ink-mid)', display: 'block', marginBottom: 4 }}>Notes</label>
            <input style={inputStyle} value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} placeholder="e.g. Only available Mon-Fri 9am-5pm, requires login" />
          </div>
          <button className="btn accent" onClick={handleSave} disabled={saving || !form.company || !form.steps}>
            {saving ? 'Saving...' : 'Save to memory'}
          </button>
        </div>
      )}

      {/* Search results */}
      {searchResults !== null && (
        <div>
          <span className="kicker" style={{ display: 'block', marginBottom: 12 }}>
            Results · {searchResults.length}
          </span>
          {searchResults.length > 0 ? (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {searchResults.map((r, i) => (
                <div key={i} className="card" style={{ padding: '16px 18px' }}>
                  <pre style={{
                    fontFamily: 'var(--mono)', fontSize: 12, lineHeight: 1.6,
                    color: 'var(--ink-2)', whiteSpace: 'pre-wrap', margin: 0,
                  }}>
                    {(r.chunks || []).map(c => c.content).join('\n') || r.title || JSON.stringify(r, null, 2)}
                  </pre>
                  {r.score && (
                    <div className="mono" style={{ fontSize: 10.5, color: 'var(--ink-low)', marginTop: 8 }}>
                      relevance: {(r.score * 100).toFixed(0)}%
                    </div>
                  )}
                </div>
              ))}
            </div>
          ) : (
            <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-low)' }}>
              <div style={{ fontSize: 15 }}>No playbooks found</div>
              <div style={{ fontSize: 13, marginTop: 4 }}>Try a different search or add a new playbook.</div>
            </div>
          )}
        </div>
      )}

      {/* Empty state when no search */}
      {searchResults === null && (
        <div style={{ textAlign: 'center', padding: 60, color: 'var(--ink-low)' }}>
          <div style={{ fontSize: 36, marginBottom: 8 }}>
            <Glyph k="book" size={36} />
          </div>
          <div style={{ fontSize: 15 }}>Search or add playbooks</div>
          <div style={{ fontSize: 13, marginTop: 4, maxWidth: 360, margin: '4px auto 0', lineHeight: 1.5 }}>
            Playbooks store step-by-step instructions for reaching live chat on company support sites.
            The browser agent uses them to skip straight to the chat widget.
          </div>
        </div>
      )}
    </div>
  );
}

    <div style={{ flex: 1, overflow: 'auto', padding: '36px 48px', maxWidth: 720 }}>
      <span className="kicker">Account</span>
      <h1 style={{ margin: '6px 0 22px', fontSize: 28, fontWeight: 500, letterSpacing: '-.02em' }}>Settings</h1>
      <div style={{ color: 'var(--ink-mid)', fontSize: 13 }}>
        Settings are configured via environment variables on the server.
      </div>
      <div style={{ marginTop: 22 }}>
        <SettingRow label="Backend" val="Express · AgentPhone MCP" />
        <SettingRow label="Notifications" val="SMS via AgentPhone" />
        <SettingRow label="Supported numbers" val="US & Canada toll-free" />
      </div>
    </div>
  );
}

function SettingRow({ label, val }) {
  return (
    <div style={{
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      padding: '16px 0', borderBottom: '.5px solid var(--rule)'
    }}>
      <span style={{ fontSize: 13, color: 'var(--ink-2)' }}>{label}</span>
      <span className="mono" style={{ fontSize: 12.5, color: 'var(--ink)' }}>{val}</span>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// App
// ═══════════════════════════════════════════════════════════════════════

const PHASES = ['spawn','call','nav','hold','human','xfer'];

function App() {
  const [route, setRoute] = React.useState('home');
  const [callTab, setCallTab] = React.useState('transcript');

  // Call state
  const [hasActiveCall, setHasActiveCall] = React.useState(false);
  const [sessionId, setSessionId] = React.useState(null);
  const [messages, setMessages] = React.useState([]);
  const [phase, setPhase] = React.useState(null);
  const [elapsed, setElapsed] = React.useState('0:00');
  const [callPhone, setCallPhone] = React.useState('');
  const [callReason, setCallReason] = React.useState('');
  const [callStatus, setCallStatus] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [callHistory, setCallHistory] = React.useState([]);

  // Web chat / race state
  const [webchatStatus, setWebchatStatus] = React.useState('idle');
  const [webchatActions, setWebchatActions] = React.useState([]);
  const [raceWinner, setRaceWinner] = React.useState(null);
  const [screenshotTs, setScreenshotTs] = React.useState(0);
  const [liveUrl, setLiveUrl] = React.useState(null);
  const [lastScreenshotUrl, setLastScreenshotUrl] = React.useState(null);

  const startedAtRef = React.useRef(null);
  const eventSourceRef = React.useRef(null);
  const timerRef = React.useRef(null);

  // Load history and active calls from server on mount
  React.useEffect(() => {
    fetch('/history').then(r => r.ok ? r.json() : []).then(data => {
      setCallHistory(data.map(h => ({
        phone: h.phone,
        reason: h.reason,
        status: h.status,
        time: new Date(h.endedAt || h.startedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
      })));
    }).catch(() => {});

    // Check for active calls
    fetch('/active').then(r => r.ok ? r.json() : []).then(data => {
      if (data.length > 0) {
        const active = data[0];
        setHasActiveCall(true);
        setCallPhone(active.phone);
        setCallReason(active.reason || '');
        setCallStatus(active.status);
        setSessionId(active.sessionId);
        setPhase(active.status === 'calling' ? 'call' : active.status === 'in_progress' ? 'nav' : 'spawn');
        startedAtRef.current = active.startedAt;
        setBusy(true);
        startStream(active.sessionId);
      }
    }).catch(() => {});
  }, []);

  // Handle tracking link: /#call/sessionId — auto-connect to existing session
  React.useEffect(() => {
    const hash = window.location.hash;
    const match = hash.match(/^#call\/(.+)$/);
    if (match) {
      const sid = match[1];
      setSessionId(sid);
      setHasActiveCall(true);
      setCallPhone('(818) 448-9009');
      setCallStatus('Connecting to session...');
      setPhase('spawn');
      setRoute('call');
      setCallTab('transcript');
      startedAtRef.current = Date.now();
      // Fetch existing session state then start streaming
      fetch(`/sessions/${sid}`)
        .then(r => r.ok ? r.json() : Promise.reject('Session not found'))
        .then(data => {
          if (data.messages) {
            const mapped = data.messages.map(m => ({
              type: m.type, text: m.text || m.content || '',
              time: new Date(m.ts).toLocaleTimeString('en-US', { hour12: false }),
            }));
            setMessages(mapped);
          }
          setCallStatus(data.status || 'connected');
          if (data.status !== 'completed' && data.status !== 'error') {
            setBusy(true);
            startStream(sid);
          }
        })
        .catch(() => {
          addMessage('error', 'Could not connect to session ' + sid.slice(0, 8));
        });
    }
  }, []);

  // Duration timer
  React.useEffect(() => {
    if (hasActiveCall && startedAtRef.current) {
      timerRef.current = setInterval(() => {
        setElapsed(formatElapsed(Date.now() - startedAtRef.current));
      }, 1000);
      return () => clearInterval(timerRef.current);
    }
  }, [hasActiveCall]);

  // Phase inference
  const inferPhase = React.useCallback((text) => {
    const lc = (text || '').toLowerCase();
    if (lc.includes('transfer') && (lc.includes('success') || lc.includes('completed'))) setPhase('xfer');
    else if ((lc.includes('human') || lc.includes('representative')) && lc.includes('connected')) setPhase('human');
    else if (lc.includes('hold') || lc.includes('waiting') || lc.includes('queue')) setPhase('hold');
    else if (lc.includes('navigat') || lc.includes('ivr') || lc.includes('menu') || lc.includes('press')) setPhase('nav');
    else if (lc.includes('my name is') || lc.includes('how can i help') || lc.includes('how can i assist')) setPhase('human');
  }, []);

  const addMessage = React.useCallback((type, text, extra = {}) => {
    const time = new Date().toLocaleTimeString('en-US', { hour12: false });
    const channel = type.startsWith('webchat_') ? 'webchat' : type === 'race_winner' ? extra.channel : 'phone';
    setMessages(prev => [...prev, { type, text, time, channel, ...extra }]);
  }, []);

  // Start SSE stream
  const startStream = React.useCallback((id) => {
    if (eventSourceRef.current) eventSourceRef.current.close();
    const es = new EventSource(`/sessions/${id}/stream`);
    eventSourceRef.current = es;

    es.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      switch (msg.type) {
        case 'assistant':
          addMessage('assistant', msg.text);
          inferPhase(msg.text);
          break;
        case 'transcript':
          if (msg.role === 'agent') {
            addMessage('assistant', msg.text);
            inferPhase(msg.text);
          } else if (msg.text && msg.text.includes('"status"')) {
            addMessage('tool_result', msg.text);
            setPhase(prev => (prev === 'call' || prev === 'spawn') ? 'nav' : prev);
          } else {
            addMessage('transcript', msg.text);
            inferPhase(msg.text);
          }
          break;
        case 'status':
          setCallStatus(msg.text);
          inferPhase(msg.text);
          break;
        case 'summary':
          addMessage('summary', msg.text);
          break;
        case 'recording':
          addMessage('recording', msg.text);
          break;
        case 'tool_call':
          addMessage('tool_call', `${msg.tool}: ${typeof msg.input === 'object' ? JSON.stringify(msg.input) : msg.input}`);
          if (msg.tool?.includes('call') && msg.tool?.includes('create')) setPhase('call');
          break;
        case 'tool_result':
          addMessage('tool_result', typeof msg.text === 'string' ? msg.text.slice(0, 500) : String(msg.text));
          inferPhase(msg.text);
          break;
        case 'result':
          addMessage('result', msg.text);
          break;
        case 'error':
          addMessage('error', msg.text);
          break;

        // ── Web chat channel events ──
        case 'webchat_status':
          addMessage('webchat_status', msg.text);
          if (msg.text?.toLowerCase().includes('launching')) setWebchatStatus('starting');
          else if (msg.text?.toLowerCase().includes('search') || msg.text?.toLowerCase().includes('finding')) setWebchatStatus('browsing');
          else if (msg.text?.toLowerCase().includes('chat') || msg.text?.toLowerCase().includes('typing')) setWebchatStatus('chatting');
          else if (msg.text?.toLowerCase().includes('finished') || msg.text?.toLowerCase().includes('completed')) setWebchatStatus('completed');
          break;
        case 'webchat_action':
          addMessage('webchat_action', msg.text);
          setWebchatActions(prev => [...prev, { text: msg.text, step: msg.step, time: new Date().toLocaleTimeString('en-US', { hour12: false }) }]);
          // Infer webchat status from actions
          if (msg.text?.toLowerCase().includes('google') || msg.text?.toLowerCase().includes('search')) setWebchatStatus('browsing');
          else if (msg.text?.toLowerCase().includes('chat') || msg.text?.toLowerCase().includes('type') || msg.text?.toLowerCase().includes('click')) setWebchatStatus('chatting');
          break;
        case 'webchat_thought':
          addMessage('webchat_thought', msg.text);
          break;
        case 'webchat_screenshot':
          addMessage('webchat_screenshot', msg.text);
          setScreenshotTs(Date.now());
          // If it's a cloud screenshot URL, save it
          if (msg.text?.startsWith('http')) setLastScreenshotUrl(msg.text);
          break;
        case 'webchat_live_url':
          setLiveUrl(msg.text);
          break;
        case 'webchat_human':
          addMessage('webchat_human', msg.text);
          setWebchatStatus('human_reached');
          break;
        case 'webchat_error':
          addMessage('webchat_error', msg.text);
          setWebchatStatus('error');
          break;
        case 'race_winner':
          addMessage('race_winner', msg.text);
          setRaceWinner(msg.channel || (msg.text?.includes('PHONE') ? 'phone' : 'webchat'));
          break;
      }
    };

    es.addEventListener('status', (e) => {
      const { status } = JSON.parse(e.data);
      setCallStatus(status);
      if (status === 'in_progress' || status === 'calling') {
        setPhase(prev => prev === 'spawn' ? 'call' : prev);
      }
    });

    es.addEventListener('done', (e) => {
      const { status } = JSON.parse(e.data);
      es.close();
      eventSourceRef.current = null;
      setBusy(false);
      clearInterval(timerRef.current);
      if (status === 'completed') {
        setPhase(prev => (prev !== 'xfer' && prev !== 'human') ? 'xfer' : prev);
      }
      // Refresh history from server
      fetch('/history').then(r => r.ok ? r.json() : []).then(data => {
        setCallHistory(data.map(h => ({
          phone: h.phone, reason: h.reason, status: h.status,
          time: new Date(h.endedAt || h.startedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
        })));
      }).catch(() => {});
      setCallStatus(status === 'completed' ? 'Done' : 'Failed');
    });

    es.onerror = () => {
      if (es.readyState === EventSource.CLOSED) {
        eventSourceRef.current = null;
        setBusy(false);
        clearInterval(timerRef.current);
      }
    };
  }, [addMessage, inferPhase, callPhone, callReason]);

  // Handle call submission
  const handleSubmit = React.useCallback(async (phone, reason, channels = { phone: true, webchat: true }) => {
    const activeChannels = channels || { phone: true, webchat: true };
    setBusy(true);
    setMessages([]);
    setPhase(activeChannels.phone ? 'spawn' : null);
    setElapsed('0:00');
    const d = phone.replace(/\D/g, '');
    const display = d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : phone;
    setCallPhone(display);
    setCallReason(reason);
    setCallStatus('Spawning agent');
    setHasActiveCall(true);
    setCallTab(activeChannels.phone && activeChannels.webchat ? 'race' : activeChannels.webchat ? 'webchat' : 'transcript');
    setRoute('call');
    startedAtRef.current = Date.now();

    // Reset webchat state
    setWebchatStatus(activeChannels.webchat ? 'starting' : 'idle');
    setWebchatActions([]);
    setRaceWinner(null);
    setScreenshotTs(0);
    setLiveUrl(null);
    setLastScreenshotUrl(null);

    const modeLabel = activeChannels.phone && activeChannels.webchat
      ? 'Dual-channel race started! Phone call + web chat racing to reach a human...'
      : activeChannels.phone
      ? 'Phone channel started — calling and navigating IVR...'
      : 'Web chat channel started — browser-use is searching for live chat...';
    addMessage('system', modeLabel);

    try {
      const res = await fetch('/navigate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, reason, channels: activeChannels }),
      });
      const data = await res.json();

      if (!res.ok) {
        addMessage('error', data?.error || 'Failed to spawn agent');
        setBusy(false);
        setPhase('error');
        return;
      }

      setSessionId(data.sessionId);
      addMessage('system', `Agent spawned — session ${data.sessionId.slice(0, 8)}`);
      startStream(data.sessionId);
    } catch (e) {
      addMessage('error', 'Network error: ' + e.message);
      setBusy(false);
      setPhase('error');
    }
  }, [addMessage, startStream]);

  const handleEndCall = React.useCallback(() => {
    if (eventSourceRef.current) {
      eventSourceRef.current.close();
      eventSourceRef.current = null;
    }
    clearInterval(timerRef.current);
    setBusy(false);
    setHasActiveCall(false);
    setPhase(null);
    setMessages([]);
    setRoute('home');
    // Reset webchat
    setWebchatStatus('idle');
    setWebchatActions([]);
    setRaceWinner(null);
    setScreenshotTs(0);
    setLiveUrl(null);
    setLastScreenshotUrl(null);
  }, []);

  const callInfo = { phone: callPhone, elapsed, status: callStatus };

  let content;
  switch (route) {
    case 'new':
      content = <RequestPage onSubmit={handleSubmit} busy={busy} />;
      break;
    case 'call':
      content = hasActiveCall ? (
        <>
          <CallHeader elapsed={elapsed} state={callStatus} phase={phase} onEnd={handleEndCall} />
          {raceWinner && <RaceWinnerBanner winner={raceWinner} />}
          <Tabs active={callTab} onChange={setCallTab} tabs={[
            { id: 'race', label: 'Race', badge: busy && !raceWinner ? 'live' : raceWinner ? 'done' : null, live: busy && !raceWinner },
            { id: 'transcript', label: 'Phone', badge: phase === 'human' ? 'human' : null, live: phase === 'human' },
            { id: 'webchat', label: 'Web Chat', badge: webchatStatus === 'human_reached' ? 'human' : null, live: webchatStatus === 'human_reached' },
          ]} />
          {callTab === 'race' && <RaceView messages={messages} phase={phase} webchatStatus={webchatStatus} webchatActions={webchatActions} raceWinner={raceWinner} sessionId={sessionId} screenshotTs={screenshotTs} liveUrl={liveUrl} lastScreenshotUrl={lastScreenshotUrl} />}
          {callTab === 'transcript' && <TranscriptPage messages={messages.filter(m => !m.channel || m.channel !== 'webchat')} phase={phase} />}
          {callTab === 'webchat' && <WebChatFullPanel messages={messages} webchatStatus={webchatStatus} webchatActions={webchatActions} sessionId={sessionId} screenshotTs={screenshotTs} liveUrl={liveUrl} lastScreenshotUrl={lastScreenshotUrl} />}
        </>
      ) : (
        <EmptyCall onNew={() => setRoute('new')} />
      );
      break;
    case 'history':
      content = <HistoryPage callHistory={callHistory} />;
      break;
    case 'playbooks':
      content = <PlaybooksPage />;
      break;
    case 'settings':
      content = <SettingsPage />;
      break;
    case 'home':
    default:
      content = (
        <HomePage
          hasActiveCall={hasActiveCall}
          callInfo={callInfo}
          callHistory={callHistory}
          onNew={() => setRoute('new')}
          onOpenCall={() => { setCallTab('transcript'); setRoute('call'); }}
        />
      );
  }

  return (
    <AppShell route={route} setRoute={setRoute} hasActiveCall={hasActiveCall} callInfo={callInfo}>
      {content}
    </AppShell>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
