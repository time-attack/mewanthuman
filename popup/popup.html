<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 20px;
      color: #e44d26;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 12px;
      color: #888;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-bar.connected {
      background: rgba(46, 160, 67, 0.15);
      color: #2ea043;
      border: 1px solid rgba(46, 160, 67, 0.3);
    }
    .status-bar.disconnected {
      background: rgba(228, 77, 38, 0.15);
      color: #e44d26;
      border: 1px solid rgba(228, 77, 38, 0.3);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .connected .dot { background: #2ea043; }
    .disconnected .dot { background: #e44d26; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #16213e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 14px;
    }
    input:focus {
      border-color: #e44d26;
    }
    input::placeholder {
      color: #555;
    }
    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: #e44d26;
      color: #fff;
    }
    .btn-primary:hover { background: #c73e1d; }
    .btn-secondary {
      background: #333;
      color: #ccc;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #444; }
    .btn-test {
      background: #16213e;
      color: #e44d26;
      border: 1px solid #e44d26;
      margin-top: 8px;
    }
    .btn-test:hover { background: #1a2744; }

    .toast {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .toast.success {
      display: block;
      background: rgba(46, 160, 67, 0.15);
      color: #2ea043;
      border: 1px solid rgba(46, 160, 67, 0.3);
    }
    .toast.error {
      display: block;
      background: rgba(228, 77, 38, 0.15);
      color: #e44d26;
      border: 1px solid rgba(228, 77, 38, 0.3);
    }

    .section { margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>MeWantHuman</h1>
    <p>Connect to a real human via AgentPhone AI</p>
  </div>

  <div id="status" class="status-bar disconnected">
    <span class="dot"></span>
    <span id="statusText">Not configured</span>
  </div>

  <div class="section">
    <label for="endpoint">API Endpoint</label>
    <input id="endpoint" type="url" placeholder="https://api.agentphone.ai/v1" />
  </div>

  <div class="section">
    <label for="apikey">API Key</label>
    <input id="apikey" type="password" placeholder="ap_live_xxxxxxxxxxxxxxxx" />
  </div>

  <div class="section">
    <label for="userid">User ID (optional)</label>
    <input id="userid" type="text" placeholder="your-user-id" />
  </div>

  <button id="saveBtn" class="btn btn-primary">Save & Connect</button>
  <button id="testBtn" class="btn btn-test">Test API Connection</button>
  <button id="clearBtn" class="btn btn-secondary">Disconnect</button>

  <div id="toast" class="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
